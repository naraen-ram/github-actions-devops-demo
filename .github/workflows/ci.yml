name: Python CI Demo

# Events that start this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Grant only the permissions needed by this workflow.
permissions:
  contents: read

# Avoid wasting runner time on older runs for the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    # Values available to steps in this job.
    env:
      PYTHONUNBUFFERED: "1"
      DEMO_ENVIRONMENT: "ci"

    steps:
      # Action: downloads the repository contents into the runner workspace.
      - name: Check out repository
        uses: actions/checkout@v4

      # Action: installs/selects the requested Python version.
      # The pip cache reuses downloaded packages based on requirements.txt.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show environment
        run: |
          python --version
          echo "Running in the ${DEMO_ENVIRONMENT} environment"
          echo "Triggered by: ${{ github.event_name }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "No third-party dependencies to install."
          fi

      # Save test output to a file and preserve the test command's exit code.
      - name: Run unit tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt

      # This step runs even if the test step fails.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          if-no-files-found: warn
          retention-days: 7

  quality:
    name: Basic code quality check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: |
          python -m compileall -q src tests
          echo "Python files compiled successfully."